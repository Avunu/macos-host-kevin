# Checks that every action used by the workflows matches .github/workflows/actions.lock.
# A separate workflow rather than a job in checks.yml, so that a lock failure
# can never block a workflow that is called from a release gate.
name: actions-lock

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: |
          if ! gh extension list | grep -q 'github/gh-actions-lock'; then
            gh extension install github/gh-actions-lock --pin v0.5.1
          fi

      - name: Verify the actions lockfile
        run: gh actions-lock --verify
